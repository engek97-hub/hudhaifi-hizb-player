<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudhaifi Hizb Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky player bar on top; hizb index on the side (drawer on phones); mushaf-style text column. Mirrors for Arabic. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#18231f; --muted:#5d6b66; --line:#d5ddd9;
  --accent:#0f5b4c; --accent-ink:#ffffff; --accent-soft:#dcebe6; --gold:#9a7425; --now:#fff3cf; --paper:#fffefa;
  --f-quran:"Amiri Quran","Amiri","Scheherazade New","Traditional Arabic",serif;
  --f-display:"Reem Kufi","Segoe UI",Tahoma,sans-serif;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[lang="ar"]{--f-ui:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --ink:#e4ebe8; --muted:#94a39d; --line:#2a3632;
  --accent:#4fb39b; --accent-ink:#06120e; --accent-soft:#1d332c; --gold:#d6b064; --now:#3a321b; --paper:#141b18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --ink:#e4ebe8; --muted:#94a39d; --line:#2a3632;
  --accent:#4fb39b; --accent-ink:#06120e; --accent-soft:#1d332c; --gold:#d6b064; --now:#3a321b; --paper:#141b18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{border-inline-end:1px solid var(--line);background:var(--surface);height:100vh;position:sticky;top:0;overflow-y:auto;padding:20px 16px}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.brand .ar{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent)}
.brand small{color:var(--muted)}
.juz{margin-top:12px}
.juz h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[lang="ar"] .juz h3{font-size:13px;letter-spacing:0}
.hz{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hz button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.hz button:hover{border-color:var(--accent)}
.hz button b{font-weight:600;font-variant-numeric:tabular-nums}
.hz button span{font-size:12px;color:var(--muted);font-family:var(--f-quran);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hz button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hz button[aria-current="true"] span{color:var(--accent-ink);opacity:.85}

main{min-width:0}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.title h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.title .range{color:var(--muted);font-size:14px}
.menu{display:none}
.ctl{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;min-width:40px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:104px;font-weight:600}
.btn svg{width:16px;height:16px;fill:currentColor}
:root[dir="rtl"] .btn svg{transform:scaleX(-1)}
.optbtn{display:none}
.btn.lang{height:32px;font-size:13px;font-weight:600;color:var(--accent);border-color:var(--accent)}
.now{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.now b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
label.opt{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
label.opt select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px}
.custom{background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.custom label.opt{color:var(--ink)}
.custom select{max-width:44vw}
.hint{font-size:12px;color:var(--muted)}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.status{font-size:13px;color:var(--gold);min-height:1em}

.page{max-width:760px;margin:0 auto;padding-block:24px 80px;padding-inline:24px}
/* Madinah mushaf pages: KFGQPC QCF4 glyph fonts, 15 lines per page, size fitted to the page width */
.mpage{background:var(--paper);border:1px solid var(--line);border-radius:8px;max-width:620px;margin:0 auto 22px;padding:12px clamp(10px,3.2vw,28px) 10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.mtop{display:flex;justify-content:space-between;direction:rtl;font-family:var(--f-quran);font-size:15px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.mlines{direction:rtl;font-size:22px}
.ml{display:flex;direction:rtl;justify-content:space-between;align-items:center;white-space:nowrap;height:1.9em;line-height:1.9em}
.ml.c{justify-content:center}
.ml.hd{justify-content:center;border:1.5px solid var(--gold);border-radius:6px;color:var(--gold);height:1.6em;line-height:1.6em;margin:.15em 0}
.ml.hd span{font-size:1.25em}
.ml.bsm{border-radius:6px}
.ml.bsm.tap{cursor:pointer}
.ml.bsm.on{background:var(--now)}
.ml.bsm.out,.ml.bsm.x{opacity:.32}
.w{cursor:pointer;border-radius:4px;transition:background .2s,opacity .2s}
.w:hover{background:var(--accent-soft)}
.w.e,.w.q{color:var(--gold)}
.w.x{opacity:.32;cursor:default}
.w.x:hover{background:none}
.w.out{opacity:.32}
.w.on{background:var(--now)}
.w.pick{box-shadow:inset 0 -2px 0 var(--accent)}
.mfoot{text-align:center;font-family:var(--f-quran);color:var(--muted);font-size:15px;margin-top:6px}
.mload{text-align:center;color:var(--muted);padding:40px 0}
.mload.err{color:var(--gold)}
.note{color:var(--muted);font-size:13px;max-width:65ch;margin-top:40px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(320px,88vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  :root[dir="rtl"] aside{transform:translateX(102%)}
  aside.open,:root[dir="rtl"] aside.open{transform:none}
  .menu{display:inline-flex}
  .bar{padding-inline:16px;gap:8px}
  .bar .opts{display:none}
  .bar.open .opts{display:flex}
  .optbtn{display:inline-flex}
  .seg button{padding:6px 9px}
  .btn{height:36px;padding:0 11px}
  .btn.primary{min-width:84px}
  .title .range{font-size:13px}
  .page{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="ar">ختمة الأحزاب</span><small id="recName"></small></div>
    <div id="index"></div>
  </aside>
  <main>
    <div class="bar">
      <div class="row" style="justify-content:space-between">
        <div class="title">
          <button class="btn menu" id="menuBtn" data-t="hizbs"></button>
          <h1 id="hTitle"></h1><span class="range" id="hRange"></span>
        </div>
        <div class="ctl">
          <button class="btn lang optbtn" id="optBtn" aria-expanded="false" aria-controls="opts"></button>
          <button class="btn lang" id="langBtn"></button>
          <button class="btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
          <button class="btn primary" id="playBtn"></button>
          <button class="btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
        </div>
      </div>
      <div class="row">
        <span class="seg" id="partSeg" role="group">
          <button data-p="0" aria-pressed="true" data-t="whole"></button><button data-p="1"></button><button data-p="2"></button><button data-p="3"></button><button data-p="4"></button><button data-p="5" data-t="choose"></button>
        </span>
      </div>
      <div class="row opts" id="opts">
        <label class="opt"><span data-t="recL"></span> <select id="reciter"><option value="hudhaifi" data-t="recH"></option><option value="nufais" data-t="recN"></option></select></label>
        <label class="opt"><span data-t="repAyah"></span> <select id="repAyah"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="5">5</option><option value="7">7</option><option value="10">10</option></select></label>
        <label class="opt"><span data-t="repRange"></span> <select id="repRange"><option value="1"></option><option value="2"></option><option value="3"></option><option value="5"></option><option value="0" data-t="loop"></option></select></label>
        <label class="opt"><span data-t="gapL"></span> <select id="gap"><option value="0" data-t="g0"></option><option value="1" data-t="g1"></option><option value="2" data-t="g2"></option><option value="4" data-t="g4"></option><option value="len" data-t="glen"></option></select></label>
        <label class="opt"><span data-t="speed"></span> <select id="speed"><option>0.75</option><option>0.9</option><option selected>1</option><option>1.25</option></select></label>
        <label class="opt" id="qualityOpt"><span data-t="quality"></span> <select id="quality"><option value="Hudhaify_64kbps" selected>64 kbps</option><option value="Hudhaify_128kbps">128 kbps</option><option value="Hudhaify_32kbps" data-t="q32"></option></select></label>
      </div>
      <div class="row custom" id="customRow" hidden>
        <label class="opt"><span data-t="from"></span> <select id="fromAy"></select></label>
        <label class="opt"><span data-t="to"></span> <select id="toAy"></select></label>
        <span class="hint" data-t="hint"></span>
      </div>
      <div class="row" style="justify-content:space-between"><span class="now" id="now"></span><span class="status" id="status"></span></div>
      <div class="progress"><i id="prog"></i></div>
    </div>
    <div class="page">
      <div id="text"></div>
      <p class="note" data-t="note"></p>
    </div>
  </main>
</div>

    const first=pg.l.flat().find(x=>x[0]<=2);
    const sec=document.createElement("section");sec.className="mpage";sec.dataset.p=n;
    sec.innerHTML=`<div class="mtop"><span>سورة ${sname(first[2])}</span><span>الجزء ${arN(juzOf(first[2],first[3]))}</span></div>`;
    const ml=document.createElement("div");ml.className="mlines";
    for(const line of (n<=2?pg.l.filter(l=>l.length):pg.l)){   // pages 1-2 are short, like the print
      const row=document.createElement("div");row.className="ml";
      for(const tk of line){
        const sp=document.createElement("span");sp.textContent=String.fromCodePoint(tk[1]);
        if(tk[0]===3){row.classList.add("hd");sp.style.fontFamily="QCF4_QBSML"}
        else if(tk[0]===4){
          const s=tk[2];row.classList.add("bsm");row.id=`b-${s}`;sp.style.fontFamily="QCF4_Hafs_01";
          if(inH(s,1)){row.classList.add("tap");row.onclick=()=>jumpTo(s,0)}else row.classList.add("x");
        }else{
          const s=tk[2],a=tk[3],k=s+":"+a;sp.style.fontFamily=font;
          sp.className="w"+(tk[0]===1?" e":tk[0]===2?" q":"");
          if(inH(s,a)){(vmap[k]=vmap[k]||[]).push(sp);sp.onclick=()=>onAyTap(s,a)}else sp.classList.add("x");
        }
        row.appendChild(sp);
      }
      ml.appendChild(row);
    }
    sec.appendChild(ml);
    sec.insertAdjacentHTML("beforeend",`<div class="mfoot">${arN(n)}</div>`);
    box.appendChild(sec);
  });
  fitPages();markRange();highlight(st.playing);
}
// Size each page so its longest line fills the width; shorter lines (pages 1-2, surah ends) are centred like the printed mushaf
function fitPages(){
  const secs=[...document.querySelectorAll(".mpage")];
  secs.forEach(sec=>{                       // measure each page once at 100px
    const ml=sec.querySelector(".mlines"),n=sec.dataset.p;
    if(fitCache[n])return;
    ml.style.fontSize="100px";let mx=0;
    const ws=[...ml.children].map(r=>{if(r.classList.contains("hd")||r.classList.contains("bsm")||!r.children.length)return 0;
      let w=0;for(const c of r.children)w+=c.getBoundingClientRect().width;mx=Math.max(mx,w);return w});
    fitCache[n]={mx,ws};
  });
  const full=Object.entries(fitCache).filter(([k])=>+k>2).map(([,v])=>v.mx).sort((a,b)=>a-b);
  const typical=full.length?full[full.length>>1]:0;
  secs.forEach(sec=>{
    const ml=sec.querySelector(".mlines"),n=+sec.dataset.p,{mx,ws}=fitCache[n];
    const ref=n<=2?(typical||mx*1.25):mx;   // pages 1-2 use the same type size as the rest of the mushaf
    ml.style.fontSize=(ml.clientWidth*100/ref*0.99)+"px";
    [...ml.children].forEach((r,i)=>{if(ws[i]&&(n<=2||ws[i]<mx*0.8))r.classList.add("c")});
  });
}
let fitT;addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fitPages,150)});
function header(){
  $("customRow").hidden=st.part!==5;
  const jz=`${t("juz")} ${N(Math.ceil(st.hizb/2))}`;
  if(st.part===5){
    const L=hizbAyahs(),[fs,fa]=L[st.from],[ts,ta]=L[st.to];
    $("hTitle").textContent=fixSep(`${t("hizb")} ${N(st.hizb)} · ${t("nAyahs",st.to-st.from+1)}`);
    $("hRange").textContent=fixSep(`${pos(fs,fa)} ${lang==="ar"?"←":"→"} ${pos(ts,ta)} · ${jz}`);
    $("fromAy").value=st.from;$("toAy").value=st.to;
  }else{
    const [ra,rb]=rangeOf(st.hizb,st.part);
    $("hTitle").textContent=fixSep(`${t("hizb")} ${N(st.hizb)}`+(st.part?` · ${t("qTitle",st.part)}`:""));
    $("hRange").textContent=fixSep(`${pos(ra[0],ra[1])} ${lang==="ar"?"←":"→"} ${pos(rb[2],rb[3])} · ${jz} · ${t("pages")} ${N(ra[4])}${lang==="ar"?" إلى ":"–"}${N(rb[5])}`);
  }
  document.querySelectorAll(".hz button").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.h===st.hizb)));
  document.querySelectorAll("#partSeg button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.p===st.part)));
  markRange();
}
function selectHizb(h,part){
  if(h!==st.hizb){st.from=0;st.to=2}
  if(part===5&&st.part!==5&&$("repRange").value==="1")$("repRange").value="0"; // ayah-range practice loops by default
  stop();st.hizb=h;st.part=part;st.pick=0;clampCustom();buildQueue();renderText();fillCustom();header();highlight();save();
  window.scrollTo({top:0});
  const cb=document.querySelector(`.hz button[data-h="${h}"]`);if(cb)cb.scrollIntoView({block:"nearest"});
}
function markRange(){
  const L=hizbAyahs(),inR=new Set();
  if(st.part===5)L.slice(st.from,st.to+1).forEach(([s,a])=>inR.add(s+":"+a));
  for(const k in vmap){const out=st.part===5&&!inR.has(k);vmap[k].forEach(e=>{e.classList.toggle("out",out);e.classList.remove("pick")})}
  if(st.part===5&&st.pick===1){const [s,a]=L[st.from];(vmap[s+":"+a]||[]).forEach(e=>e.classList.add("pick"))}
  document.querySelectorAll(".bsm.tap").forEach(b=>b.classList.toggle("out",st.part===5&&!inR.has(b.id.slice(2)+":1")));
}
function setRange(f,to){
  if(to<f)[f,to]=[to,f];
  stop();st.from=f;st.to=to;buildQueue();header();highlight();save();
}
function onAyTap(s,a){
  if(st.part!==5){jumpTo(s,a);return}
  const k=hizbAyahs().findIndex(x=>x[0]===s&&x[1]===a);
  if(st.pick===0){st.pick=1;setRange(k,k);$("status").textContent=t("startSet")}
  else{st.pick=0;setRange(st.from,k)}
}
$("fromAy").onchange=()=>{st.pick=0;setRange(+$("fromAy").value,st.to)};
$("toAy").onchange=()=>{st.pick=0;setRange(st.from,+$("toAy").value)};
function highlight(scroll){
  document.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));
  const it=st.queue[st.i];if(!it)return;
  const els=it.a===0?[$(`b-${it.s}`)].filter(Boolean):(vmap[it.s+":"+it.a]||[]);
  els.forEach(e=>e.classList.add("on"));
  if(scroll&&els[0])els[0].scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const ayCount=st.queue.filter(x=>x.a).length, done=st.queue.slice(0,st.i).filter(x=>x.a).length;
  $("prog").style.width=(done/ayCount*100)+"%";
  if(!st.playing&&st.i===0&&st.ayRep===0&&st.rangeRep===0){$("now").textContent=t("intro");return}
  const rr=+$("repRange").value;
  $("now").innerHTML=fixSep(it.a===0?`<b>${t("basmala")}</b> · ${t("before",sn(it.s))}`:
    `<b>${pos(it.s,it.a)}</b> · ${t("ayOf",done+1,ayCount)} · ${t("rep",st.ayRep+1,$("repAyah").value)}`+(rr!==1?` · ${t("round")} ${N(st.rangeRep+1)}${rr?"/"+N(rr):""}`:""));
}
const NUF="https://cdn.mp3quran.net/audio/ahmad-nufais/r1/";   // files that match mp3quran's timing data (read 259)
const timings={};
async function getTimings(s){
  if(timings[s])return timings[s];
  const r=await fetch(`https://mp3quran.net/api/v3/ayat_timing?surah=${s}&read=259`);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const m={};for(const x of await r.json())m[x.ayah]=[x.start_time,x.end_time];
  if(!m[1])throw new Error("no timings");
  return timings[s]=m;
}
function segRange(m,it){return it.a===0?(m[0]||[0,m[1][0]]):m[it.a]}
let seg=null,segRaf=0,playToken=0;
function cancelSeg(){seg=null;cancelAnimationFrame(segRaf)}
function applyReciter(){
  $("reciter").value=st.rec;
  $("recName").textContent=t(st.rec==="nufais"?"reciterN":"reciter");
  $("qualityOpt").hidden=st.rec==="nufais";
}
async function playCurrent(){
  clearTimeout(st.timer);cancelSeg();
  const it=st.queue[st.i];if(!it){stop();return}
  const tok=++playToken;
  audio.playbackRate=+$("speed").value;
  $("status").textContent="";
  highlight(true);
  if(st.rec==="hudhaifi"){
    const [s,a]=it.a===0?[1,1]:[it.s,it.a];
    audio.src=url(s,a);audio.playbackRate=+$("speed").value;
    audio.play().catch(()=>{$("status").textContent=t("errStart");setPlaying(false)});
    const nx=st.queue[st.i+1];if(nx){const [ns,na]=nx.a===0?[1,1]:[nx.s,nx.a];pre.src=url(ns,na)}  // preload next ayah
    return;
  }
  let m;
  try{if(!timings[it.s])$("status").textContent=t("loading");m=await getTimings(it.s)}
  catch(e){if(tok===playToken){$("status").textContent=t("errTiming");setPlaying(false)}return}
  if(tok!==playToken||!st.playing)return;
  const r=segRange(m,it);
  const file=NUF+pad(it.s)+".mp3";
  if(audio.src!==file)audio.src=file;
  seg={start:r[0]/1000,end:r[1]/1000,s:it.s};
  const go=()=>{if(tok!==playToken)return;audio.currentTime=seg.start;audio.playbackRate=+$("speed").value;
    audio.play().then(()=>{$("status").textContent=""}).catch(()=>{$("status").textContent=t("errStart");setPlaying(false)})};
  if(audio.readyState>=1)go();else audio.addEventListener("loadedmetadata",go,{once:true});
  watchSeg();
  const nx=st.queue.find((x,k)=>k>st.i&&x.s!==it.s);if(nx)getTimings(nx.s).catch(()=>{});  // fetch the next surah's timings early
}
// Al-Nufais: one file per surah, so stop at the ayah's end time (or flow straight into the next ayah when nothing needs a pause)
function segCheck(){
  if(!seg||audio.paused||audio.currentTime<seg.end-0.04)return;
  const it=st.queue[st.i],nx=st.queue[st.i+1];
  const reps=it&&it.a?+$("repAyah").value:1;
  if($("gap").value==="0"&&st.ayRep+1>=reps&&nx&&nx.s===seg.s&&timings[nx.s]){
    const r=segRange(timings[nx.s],nx);
    if(Math.abs(r[0]/1000-seg.end)<0.6){st.i++;st.ayRep=0;seg={start:r[0]/1000,end:r[1]/1000,s:nx.s};highlight(true);return}
  }
  const d=(seg.end-seg.start)*1000/audio.playbackRate;cancelSeg();audio.pause();onItemEnd(d);
}
function watchSeg(){cancelAnimationFrame(segRaf);const tick=()=>{if(!seg)return;segCheck();segRaf=requestAnimationFrame(tick)};segRaf=requestAnimationFrame(tick)}
audio.addEventListener("timeupdate",segCheck);   // keeps working when the screen is off and animation frames stop
function advance(){
  const it=st.queue[st.i];
  const reps=it&&it.a?+$("repAyah").value:1;
  if(st.ayRep+1<reps){st.ayRep++;playCurrent();return}
  st.ayRep=0;st.i++;
  if(st.i>=st.queue.length){
    const rr=+$("repRange").value;st.rangeRep++;
    if(rr===0||st.rangeRep<rr){st.i=0;playCurrent();return}
    st.i=0;st.rangeRep=0;stop();
    const what=st.part===5?t("yourAyahs"):`${t("hizb")} ${N(st.hizb)}${st.part?" · "+t("qTitle",st.part):""}`;
    $("now").innerHTML=fixSep(t("finished",what));$("prog").style.width="100%";return;
  }
  playCurrent();
}
function onItemEnd(durMs){
  if(!st.playing)return;
  const g=$("gap").value, it=st.queue[st.i];
  const ms=g==="len"?(it&&it.a?durMs:0):(+g*1000);
  if(ms>0){$("status").textContent=g==="len"?t("turn"):"";st.timer=setTimeout(()=>{$("status").textContent="";advance()},ms)}
  else advance();
}
audio.addEventListener("ended",()=>{
  if(st.rec==="hudhaifi")onItemEnd(audio.duration*1000/audio.playbackRate);
  else if(seg){const d=(seg.end-seg.start)*1000/audio.playbackRate;cancelSeg();onItemEnd(d)}
});
audio.addEventListener("error",()=>{if(audio.src&&st.playing){$("status").textContent=t("errLoad");setPlaying(false)}});
audio.addEventListener("waiting",()=>{$("status").textContent=t("loading")});
audio.addEventListener("playing",()=>{$("status").textContent=""});
function setPlaying(p){st.playing=p;$("playBtn").textContent=p?t("pause"):t("play")}
function stop(){clearTimeout(st.timer);playToken++;cancelSeg();audio.pause();setPlaying(false);$("status").textContent=""}
function jumpTo(s,a){const k=st.queue.findIndex(x=>x.s===s&&x.a===a);if(k<0)return;st.i=k;st.ayRep=0;setPlaying(true);playCurrent()}
$("playBtn").onclick=()=>{
  if(st.playing){audio.pause();clearTimeout(st.timer);setPlaying(false);return}
  setPlaying(true);
  const mid=st.rec==="hudhaifi"?(audio.src&&audio.currentTime>0&&!audio.ended):!!seg;
  if(mid){audio.play().catch(()=>{});highlight(true);if(seg)watchSeg()}else playCurrent();
};
$("nextBtn").onclick=()=>{if(st.i<st.queue.length-1){st.i++;st.ayRep=0;setPlaying(true);playCurrent()}};
$("prevBtn").onclick=()=>{if(st.i>0){st.i--;st.ayRep=0;setPlaying(true);playCurrent()}};
document.querySelectorAll("#partSeg button").forEach(b=>b.onclick=()=>selectHizb(st.hizb,+b.dataset.p));
["repAyah","repRange","gap"].forEach(k=>$(k).onchange=()=>{save();highlight()});
$("speed").onchange=()=>{audio.playbackRate=+$("speed").value;save()};
$("quality").onchange=()=>save();
$("reciter").onchange=()=>{stop();st.rec=$("reciter").value;audio.removeAttribute("src");audio.load();applyReciter();highlight();save()};
$("menuBtn").onclick=()=>$("side").classList.toggle("open");
$("optBtn").onclick=()=>{const o=document.querySelector(".bar").classList.toggle("open");$("optBtn").setAttribute("aria-expanded",String(o));fitPages()};
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";applyLang();buildIndex();fillCustom();header();highlight();save()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.code==="Space"){e.preventDefault();$("playBtn").click()}});
load();applyLang();buildIndex();selectHizb(st.hizb,st.part);
</script>
